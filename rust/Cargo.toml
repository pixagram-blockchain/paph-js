[package]
name    = "paph3"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "PAPH v3 — integer-only perceptual hash for pixel-art plagiarism detection (SPEC-003)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# none, on purpose.  This is a consensus artefact: every dependency is another
# way for two nodes to disagree.

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
